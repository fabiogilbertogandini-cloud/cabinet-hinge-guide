<title>Cabinet and Hinge Field Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Shop names, Blum catalogue terms and part numbers for cabinets and hinges. EN/FR.">
<meta name="theme-color" content="#1c2226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Field Guide">

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: shop-drawing reference sheet. Sticky search bar on top, plan-view drawings, part numbers set as mono stamps, one amber accent for hardware. */
:root{
  --paper:#f4f6f5; --card:#ffffff; --ink:#1c2226; --muted:#59636a; --line:#c8d0d2;
  --accent:#b9531a; --accent-soft:#f5e3d6; --wall:#9aa6ab; --zone:#e9d9c9; --diagram:#2c5a78;
  --ok:#2e6b4a; --warn:#9a5b00; --warn-soft:#fbf0db; --bar:#1c2226; --bar-ink:#f4f6f5; --photo:#ffffff;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14181b; --card:#1b2024; --ink:#e4e9eb; --muted:#9ba6ac; --line:#323a3f;
  --accent:#f0894a; --accent-soft:#3b2a1f; --wall:#58646a; --zone:#3d3027; --diagram:#8db7d4;
  --ok:#7cc79c; --warn:#f0b65a; --warn-soft:#33281a; --bar:#0d1012; --bar-ink:#e4e9eb; --photo:#e9ecec; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14181b; --card:#1b2024; --ink:#e4e9eb; --muted:#9ba6ac; --line:#323a3f;
  --accent:#f0894a; --accent-soft:#3b2a1f; --wall:#58646a; --zone:#3d3027; --diagram:#8db7d4;
  --ok:#7cc79c; --warn:#f0b65a; --warn-soft:#33281a; --bar:#0d1012; --bar-ink:#e4e9eb; --photo:#e9ecec; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
main.wrap{display:flex;flex-direction:column;gap:56px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:700;letter-spacing:.01em}
h2{font-size:clamp(1.6rem,3.2vw,2.2rem);font-weight:700}
h3{font-size:1.25rem;font-weight:600}
p{margin:0;max-width:68ch}
a{color:var(--diagram)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow,.lbl{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.11em;font-size:.8rem;font-weight:600;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.small{font-size:.88rem;color:var(--muted)}
section,[id]{scroll-margin-top:84px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);padding-block:10px}
.topbar .wrap{display:flex;gap:10px;align-items:center}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.1rem;letter-spacing:.03em;white-space:nowrap}
@media (max-width:620px){.brand{display:none}}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;font:inherit;font-size:1rem;padding:10px 12px 10px 38px;border-radius:8px;border:1px solid transparent;background:#ffffff;color:#1c2226}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#59636a;fill:none;stroke-width:2}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-height:min(70vh,520px);overflow:auto;padding:6px}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 10px;border-radius:6px;cursor:pointer;text-decoration:none;color:inherit}
.res:hover,.res.on{background:var(--accent-soft)}
.res b{font-family:var(--f-display);font-size:1.05rem;font-weight:600}
.res .kind{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);align-self:center}
.res .why{grid-column:1/-1;font-size:.84rem;color:var(--muted)}
.res .why mark{background:none;color:var(--accent);font-weight:600}
.nores{padding:12px;color:var(--muted);font-size:.92rem}
.langbtn{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;background:transparent;color:var(--bar-ink);border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:9px 10px;cursor:pointer;white-space:nowrap}
.langbtn:hover{border-color:var(--accent)}

header.hero{display:flex;flex-direction:column;gap:12px}
.stamp{display:inline-flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.86rem;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:8px 12px;width:fit-content;max-width:100%}
.stamp b{font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;color:var(--ok)}
.note{border:1px solid var(--line);background:var(--warn-soft);border-radius:6px;padding:10px 14px;font-size:.92rem;max-width:none}
nav.toc{display:flex;flex-wrap:wrap;gap:8px}
nav.toc a{font-family:var(--f-display);font-weight:600;letter-spacing:.04em;text-decoration:none;color:var(--ink);border:1px solid var(--line);padding:6px 12px;border-radius:999px;background:var(--card)}
nav.toc a:hover{border-color:var(--accent)}
.tryit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tryit button{font:inherit;font-size:.86rem;border:1px dashed var(--line);border-radius:4px;padding:2px 8px;background:var(--paper);color:var(--ink);cursor:pointer}
.tryit button:hover{border-color:var(--accent)}

.pn{font-family:var(--f-mono);font-size:.84em;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:3px;white-space:nowrap}
.fin{font-family:var(--f-mono);font-size:.74em;color:var(--muted);border:1px solid var(--line);padding:0 5px;border-radius:3px;white-space:nowrap}
.aka{display:flex;flex-wrap:wrap;gap:6px}
.aka span{font-size:.84rem;border:1px dashed var(--line);border-radius:4px;padding:1px 7px;background:var(--paper)}
.aka span.off{border-style:solid;border-color:var(--ok);color:var(--ok)}

/* hinge cards */
.hinges{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0;scroll-margin-top:90px}
.hcard .ph{background:var(--photo);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.hcard .ph img.contain{object-fit:contain;padding:10px}
.hcard .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.hcard .blum{font-size:.88rem;color:var(--muted)}
.parts{display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.parts div{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.ref{font-size:.84rem;color:var(--muted)}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;outline:3px solid var(--accent)}}

/* corners */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.corner{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0;scroll-margin-top:90px}
.corner svg{width:100%;height:auto;max-width:250px;align-self:center}
ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
li{max-width:66ch}
.use li::marker{color:var(--ok)}
.watch li::marker{color:var(--warn)}
.deep{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.deep{grid-template-columns:minmax(0,1fr)}}
.fig{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;margin:0}
.fig svg{width:100%;height:auto}
.fig figcaption{font-size:.88rem;color:var(--muted)}
.seq{overflow-x:auto}
.seq svg{min-width:600px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;color:var(--muted);font-weight:600;background:var(--paper)}
tr:last-child td{border-bottom:0}

/* svg tokens */
.s-wall{fill:var(--wall)}
.s-box{fill:var(--card);stroke:var(--ink);stroke-width:2}
.s-adj{fill:var(--paper);stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
.s-door{stroke:var(--accent);stroke-width:5;stroke-linecap:round;fill:none}
.s-door-ghost{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 4;fill:none;opacity:.6}
.s-susan{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.s-blind{fill:var(--zone)}
.s-ink{fill:var(--ink)}
.s-muted{fill:var(--muted)}
.s-line{stroke:var(--muted);stroke-width:1;fill:none}
.s-arrow{stroke:var(--diagram);stroke-width:2;fill:none}
.s-arrowhead{fill:var(--diagram)}
.s-hinge{fill:var(--diagram)}
.s-plate{fill:var(--card);stroke:var(--diagram);stroke-width:2}
svg text{font-family:var(--f-body);font-size:11px}
svg .t-lbl{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;font-size:12px;text-transform:uppercase}

/* cabinets */
.fam{display:flex;flex-direction:column;gap:14px}
.cabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.cab{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:start;scroll-margin-top:90px}
.cab svg{width:64px;height:auto}
.cab .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.cab .code{font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.cab .hw{font-size:.88rem}
details.ask{border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
details.ask summary{cursor:pointer;font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.78rem;color:var(--diagram);list-style:none}
details.ask summary::-webkit-details-marker{display:none}
details.ask summary::before{content:"+ "}
details.ask[open] summary::before{content:"− "}
details.ask ul{margin-top:6px;font-size:.88rem}
.e-box{fill:var(--card);stroke:var(--ink);stroke-width:1.6}
.e-front{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
.e-h{stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.e-thin{stroke:var(--muted);stroke-width:1;fill:none}
.e-glass{fill:var(--accent-soft);stroke:var(--muted);stroke-width:1}
.e-kick{fill:var(--wall)}
.e-arrow{stroke:var(--diagram);stroke-width:1.6;fill:none}

/* overlay drawings */
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.app{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;scroll-margin-top:90px}
.app .ph{background:#ffffff;padding:6px}
.app .ph img{width:100%;display:block}
.app .bd{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.checklist{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
footer{display:flex;flex-direction:column;gap:10px;font-size:.88rem;color:var(--muted);padding-block:0 40px}
</style>

<div class="topbar gutter">
  <div class="wrap">
    <span class="brand" id="brand">Field Guide</span>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>

      <div class="results" id="results" hidden role="listbox"></div>
    </div>
    <button class="langbtn" id="lang" type="button" aria-label="Switch language">FR</button>
  </div>
</div>

let L = "en";
try { const s = localStorage.getItem("fg-lang"); if (s === "fr" || s === "en") L = s; else if ((navigator.language||"").toLowerCase().startsWith("fr")) L = "fr"; } catch(e) {}
const t = o => (o && typeof o === "object" && !Array.isArray(o)) ? (o[L] ?? o.en) : o;
const u = k => UI[L][k];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pnify = s => esc(s).replace(/\b(\d{2,3}[A-Z]\d{3,4}[A-Z0-9]*(?:\.[A-Z0-9]+)*|\d{2}\.\d{4}(?:\.BP)?)\b/g, '<span class="pn">$1</span>');
const pageLink = p => `<a href="${CAT.url(p)}" target="_blank" rel="noopener">${u("ref")} ${CAT.digital} p.${p}</a>`;
const akaHTML = (off, aka) => `<div class="aka">${off ? `<span class="off">${esc(t(off))}</span>` : ""}${[...(aka.en||[]), ...(L==="fr" ? (aka.fr||[]) : [])].map(a=>`<span>${esc(a)}</span>`).join("")}</div>`;

/* elevation and plan glyphs for cabinet cards */
function elev(rows, o){
  o = o || {}; const W=60, H=o.h||60, kick=o.kick?6:0, p=3;
  let s=`<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><rect class="e-box" x="1" y="1" width="${W-2}" height="${H-2-kick}"/>`;
  if (kick) s+=`<rect class="e-kick" x="4" y="${H-kick-1}" width="${W-8}" height="${kick}"/>`;
  const total=rows.reduce((a,r)=>a+r[0],0); let y=1+p; const avail=H-2-kick-p*(rows.length+1);
  rows.forEach(r=>{
    const h=avail*r[0]/total, n=r[2]||1, gw=(W-2-p*(n+1))/n;
    for(let i=0;i<n;i++){
      const x=1+p+i*(gw+p), k=r[1];
      if(k==="open"){s+=`<line class="e-thin" x1="${x}" y1="${y+h/3}" x2="${x+gw}" y2="${y+h/3}"/><line class="e-thin" x1="${x}" y1="${y+2*h/3}" x2="${x+gw}" y2="${y+2*h/3}"/>`;continue;}
      if(k==="appl"){s+=`<rect class="e-front" x="${x}" y="${y}" width="${gw}" height="${h}"/><rect class="e-glass" x="${x+5}" y="${y+h*.3}" width="${gw-10}" height="${h*.55}"/><line class="e-h" x1="${x+6}" y1="${y+h*.15}" x2="${x+gw-6}" y2="${y+h*.15}"/>`;continue;}
      if(k==="gap"){s+=`<rect class="e-glass" x="${x}" y="${y}" width="${gw}" height="${h}"/>`;continue;}
      s+=`<rect class="e-front" x="${x}" y="${y}" width="${gw}" height="${h}"${k==="false"?' stroke-dasharray="3 2"':''}/>`;
      if(k==="glass") s+=`<rect class="e-glass" x="${x+4}" y="${y+4}" width="${gw-8}" height="${h-8}"/>`;
      if(k==="drw"||k==="false") s+=`<line class="e-h" x1="${x+gw/2-6}" y1="${y+h/2}" x2="${x+gw/2+6}" y2="${y+h/2}"/>`;
      else if(k==="door"||k==="glass"){const hx=(n>1&&i===0)?x+gw-4:(n>1?x+4:x+gw-4);const hy=o.wall?y+h-10:y+4;s+=`<line class="e-h" x1="${hx}" y1="${hy}" x2="${hx}" y2="${hy+8}"/>`;}
      else if(k==="lift") s+=`<line class="e-h" x1="${x+gw/2-6}" y1="${y+h-4}" x2="${x+gw/2+6}" y2="${y+h-4}"/><path class="e-arrow" d="M${x+gw/2} ${y+h-9} V${y+5} M${x+gw/2-4} ${y+9} L${x+gw/2} ${y+5} L${x+gw/2+4} ${y+9}"/>`;
      else if(k==="pocket") s+=`<path class="e-arrow" d="M${x+gw-6} ${y+h/2} H${x+6} M${x+10} ${y+h/2-4} L${x+6} ${y+h/2} L${x+10} ${y+h/2+4}"/>`;
      else if(k==="pull") s+=`<line class="e-h" x1="${x+gw/2}" y1="${y+6}" x2="${x+gw/2}" y2="${y+16}"/>`;
    }
    y+=h+p;
  });
  return s+"</svg>";
}
function plan(type){
  const head='<svg viewBox="0 0 60 60" aria-hidden="true"><rect class="e-kick" x="2" y="2" width="56" height="4"/><rect class="e-kick" x="2" y="2" width="4" height="56"/>';
  if(type==="pie") return head+'<polygon class="e-box" points="6,6 52,6 52,36 36,36 36,52 6,52"/><line class="e-h" x1="36" y1="36" x2="52" y2="36"/><line class="e-h" x1="36" y1="36" x2="36" y2="52"/></svg>';
  if(type==="blind") return head+'<rect class="e-box" x="6" y="6" width="50" height="30"/><rect class="e-glass" x="7" y="7" width="30" height="28"/><line class="e-h" x1="40" y1="36" x2="56" y2="36"/></svg>';
  if(type==="diag") return head+'<polygon class="e-box" points="6,6 52,6 52,36 36,52 6,52"/><line class="e-h" x1="52" y1="36" x2="36" y2="52"/></svg>';
  if(type==="drawer") return head+'<polygon class="e-box" points="6,6 52,6 52,36 36,36 36,52 6,52"/><line class="e-h" x1="36" y1="36" x2="52" y2="36"/><line class="e-h" x1="36" y1="36" x2="36" y2="52"/><path class="e-arrow" d="M44 44 l8 8"/></svg>';
  return "";
}
const glyph = g => g[0]==="plan" ? plan(g[1]) : elev(g[1], g[2]);

/* ---------- Render ---------- */
function render(){
  document.documentElement.lang = L === "fr" ? "fr-CA" : "en-CA";
  document.title = u("title");
  document.getElementById("brand").textContent = u("brand");
  document.getElementById("q").placeholder = u("search");
  document.getElementById("lang").textContent = u("lang");
  const ids = ["hinges","corners","pie","blind","diag","types","terms","ask"];
  const tries = L==="fr" ? ["coin pliant","carrousel","79T8500","noir onyx","embase"] : ["pie corner","lazy susan","BBC","black hinge","base plate","32mm"];

  let h = `<header class="hero">
    <span class="eyebrow">Blum · West Team</span>
    <h1>${u("title")}</h1>
    <p>${u("intro")}</p>
    <div class="stamp"><b>${u("verified")}</b><span>${u("stamp")}</span></div>
    <div class="tryit"><span class="small">${u("try")}</span>${tries.map(x=>`<button type="button" data-try="${esc(x)}">${esc(x)}</button>`).join("")}</div>
    <nav class="toc" aria-label="Sections">${u("toc").map((x,i)=>`<a href="#${ids[i]}">${esc(x)}</a>`).join("")}</nav>
  </header>`;

  /* hinges */
  h += `<section id="hinges" class="stack"><span class="eyebrow">${u("hinges")}</span><h2>${u("hinges")}</h2><p>${u("hingesSub")} ${u("pages")}</p><div class="hinges">`;
  HINGES.forEach(x=>{
    h += `<article class="hcard" id="${x.id}">
      <div class="ph"><img src="${IMG[x.img]}" alt="${esc(t(x.name))}" loading="lazy"${x.contain?' class="contain"':''}></div>
      <div class="bd">
        <h3>${esc(t(x.name))}</h3>
        <span class="blum"><span class="lbl">${u("blumName")}</span> ${esc(t(x.off))}</span>
        <div class="parts">${x.parts.map(p=>`<div><span class="pn">${p[0]}</span><span>${esc(t(p[1]))}</span><span class="fin">${p[2]}</span></div>`).join("")}</div>
        <span class="small">${pnify(t(x.extra))}</span>
        <span><span class="lbl">${u("use")}</span><br>${esc(t(x.use))}</span>
        <span class="lbl">${u("aka")}</span>${akaHTML(null, x.aka)}
        <span class="ref">${pageLink(x.page)}${x.web?` · ${u("web")} <span class="fin">${x.web}</span>`:""}</span>
      </div></article>`;
  });
  h += `</div></section>`;

  /* corners */
  h += `<section id="corners" class="stack"><span class="eyebrow">${u("toc")[1]}</span><h2>${u("corners")}</h2><p>${u("cornersSub")}</p><div class="grid3">`;
  CORNERS.forEach(c=>{
    h += `<article class="corner" id="corner-${c.id}">
      <span class="lbl">${esc(t(c.sub))}</span><h3>${esc(t(c.name))}</h3>
      ${bigSVG(c.id)}
      <span class="small"><span class="lbl">${u("blumName")}</span> ${esc(t(c.off))}</span>
      ${akaHTML(null, c.aka)}
      <span class="lbl">${u("useWhen")}</span><ul class="use">${t(c.use).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <span class="lbl">${u("watch")}</span><ul class="watch">${t(c.watch).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      ${c.hw?`<span class="small">${pnify(c.hw)}</span>`:""}
    </article>`;
  });
  h += `</div></section>`;

  h += deepDives();

  /* cabinet types */
  h += `<section id="types" class="stack"><span class="eyebrow">${u("types")}</span><h2>${u("types")}</h2><p>${u("typesSub")}</p>`;
  FAM.forEach(f=>{
    h += `<div class="fam"><div class="stack" style="gap:2px"><h3 style="font-size:1.45rem">${esc(t(f.fam))}</h3><span class="small">${esc(t(f.note))}</span></div><div class="cabs">`;
    f.items.forEach(c=>{
      h += `<article class="cab" id="${c.id}">${glyph(c.g)}<div class="body">
        <h3>${esc(t(c.name))}</h3><span class="code">${u("code")}: ${esc(c.code)}</span>
        ${akaHTML(null, c.aka)}

        ${c.link?`<a class="small" href="#${c.link}">→ ${esc(t(CORNERS.find(k=>k.id===c.link)?.name||""))}</a>`:""}

  TERMS.forEach(x=>{

  h += `</div><span class="small">${L==="fr"?"Dessins : catalogue Blum, charnière 110°.":"Drawings: Blum catalogue, 110° hinge."} ${pageLink(70)}</span></section>`;

  /* footer */
  h += `<footer><div class="note">${u("disclaimer")}</div>
    <span class="lbl">${u("sources")}</span>
    <span>Blum ${L==="fr"?"catalogue et manuel technique":"catalogue and technical manual"} ${CAT.digital}: <a href="${CAT.url(68)}" target="_blank" rel="noopener">publications.blum.com/2026/catalogue/en</a> · ${L==="fr"?"Photos et dessins : Blum.":"Photos and drawings: Blum."}</span>
    <span>${u("built")} ${L==="fr"?"Vérifié le":"Checked"} ${CAT.checked}.</span></footer>`;

  document.getElementById("app").innerHTML = h;
  document.querySelectorAll("[data-try]").forEach(b=>b.addEventListener("click",()=>{const q=document.getElementById("q");q.value=b.dataset.try;q.focus();search();}));
}

function deepDives(){
  const fr = L==="fr";
  return `
  <section id="pie" class="stack">
    <span class="eyebrow">${fr?"En détail":"Deep dive"}</span>
    <h2>${fr?"Coin à portes pliantes : d'où vient le nom et comment ça marche":"Pie corner: where the name comes from and how it works"}</h2>
    <div class="deep">
      <div class="stack">
        <p><b>${fr?"Le nom vient de la tablette, pas du caisson.":"The name comes from the shelf, not the box."}</b> ${fr?"En anglais, une « pie-cut lazy Susan » est un plateau rond auquel il manque un quart, comme une tarte dont on a retiré une pointe. Cet espace manquant laisse la place aux deux portes dans le coin intérieur.":"A pie-cut lazy Susan is a round shelf with one 90° wedge removed, like a pie with a slice taken out. Some people call it a Pac-Man shelf. The missing wedge leaves room for the two doors at the inside corner."}</p>
        <p>${fr?"Le nom est ensuite passé au caisson (« pie-cut corner », BCP en bas, WCP en haut) et à ses charnières. Chez Blum, c'est le meuble d'angle à portes pliantes.":"Over time the name spread to the whole cabinet (pie-cut corner, BCP for base, WCP for wall) and to its hinges. A wall pie-cut often has no Susan but keeps the name because the doors work the same way. Blum calls it a corner cabinet with bi-fold door."}</p>
        <p><b>${fr?"Deux sortes de plateaux.":"Two kinds of Susan fit this box."}</b> ${fr?"Plateau en pointe : les portes sont fixées au plateau et tournent avec lui. Plateau en haricot : les portes sont sur charnières et le plateau tourne seul.":"Pie-cut: the doors are fixed to the shelves and spin into the cabinet with them. Kidney: the doors are hinged and the shelf turns on its own."}</p>
        <p><b>${fr?"Ce n'est pas un coin aveugle.":"Not a blind corner."}</b> ${fr?"Ici, deux portes pliées ensemble. Le coin aveugle a une seule porte et une partie cachée. Les charnières Blum sont différentes.":"A pie corner has two doors folding as a pair. A blind corner has one door and a hidden section. They use different Blum hinges."}</p>

/* ---------- Search ---------- */
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[°″"'’.\-_/()·|]/g," ").replace(/\s+/g," ").trim();
const squash = s => norm(s).replace(/ /g,"");
function buildIndex(){
  const idx=[];
  const add=(id,kind,name,terms)=>{ const all=terms.filter(Boolean).map(String); idx.push({id,kind,name,all,hay:all.map(a=>({raw:a,n:norm(a),s:squash(a)}))}); };
  HINGES.forEach(x=>add(x.id,"hinge",x.name,[x.name.en,x.name.fr,x.off.en,x.off.fr,...x.aka.en,...x.aka.fr,...x.parts.map(p=>p[0]),...x.parts.map(p=>p[1].en),x.web,(x.extra.en.match(/\b\d{2,3}[A-Z]\d{3,4}[A-Z0-9.]*|\b\d{2}\.\d{4}/g)||[]).join(" ")]));
  CORNERS.forEach(c=>add("corner-"+c.id,"corner",c.name,[c.name.en,c.name.fr,c.off.en,c.off.fr,...c.aka.en,...c.aka.fr,c.hw]));
  FAM.forEach(f=>f.items.forEach(c=>add(c.id,"cab",c.name,[c.name.en,c.name.fr,c.code,...c.aka.en,...c.aka.fr])));
  TERMS.forEach(x=>add(x.id,"term",x.name,[x.name.en,x.name.fr,...x.aka.en,...x.aka.fr]));
  return idx;
}
const INDEX = buildIndex();
let sel = -1, current = [];
function search(){
  const box=document.getElementById("results"), qv=document.getElementById("q").value;
  const q=norm(qv), qs=squash(qv);
  if(!q){box.hidden=true;current=[];return;}
  const toks=q.split(" ");
  const scored=[];
  INDEX.forEach(e=>{
    let best=null, score=0;
    e.hay.forEach(h=>{
      let s=0;
      if(h.s===qs) s=100; else if(h.s.startsWith(qs)) s=80; else if(h.s.includes(qs)) s=60;
      else if(toks.every(tk=>h.n.includes(tk))) s=40;
      if(s>score){score=s;best=h.raw;}
    });
    if(!score){ const joined=e.hay.map(h=>h.n).join(" "); if(toks.every(tk=>joined.includes(tk))){score=20;best=null;} }
    if(score) scored.push({e,score,best});
  });
  scored.sort((a,b)=>b.score-a.score);
  current=scored.slice(0,8); sel=current.length?0:-1;
  if(!current.length){box.innerHTML=`<div class="nores">${u("noRes")}</div>`;box.hidden=false;return;}
  box.innerHTML=current.map((r,i)=>{
    const nm=t(r.e.name);
    const why = r.best && norm(r.best)!==norm(nm) ? `<span class="why">${u("matched")} “<mark>${esc(r.best)}</mark>”</span>` : "";
    return `<a class="res${i===sel?" on":""}" href="#${r.e.id}" data-id="${r.e.id}" role="option"><b>${esc(nm)}</b><span class="kind">${u("kinds")[r.e.kind]}</span>${why}</a>`;
  }).join("");
  box.hidden=false;
}
function go(id){
  const el=document.getElementById(id)||document.getElementById("corner-"+id);
  document.getElementById("results").hidden=true;
  if(!el) return;
  el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"});
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  const d=el.querySelector("details"); if(d) d.open=true;
}
function wire(){
  const q=document.getElementById("q"), box=document.getElementById("results");
  q.addEventListener("input",search);
  q.addEventListener("focus",()=>{ if(q.value) search(); });
  q.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){ if(!current.length) return; e.preventDefault(); sel=(sel+(e.key==="ArrowDown"?1:-1)+current.length)%current.length; [...box.querySelectorAll(".res")].forEach((n,i)=>n.classList.toggle("on",i===sel)); }
    else if(e.key==="Enter"){ if(sel>=0&&current[sel]){ e.preventDefault(); go(current[sel].e.id); q.blur(); } }
    else if(e.key==="Escape"){ box.hidden=true; }
  });
  box.addEventListener("click",e=>{ const a=e.target.closest(".res"); if(!a) return; e.preventDefault(); go(a.dataset.id); });
  document.addEventListener("click",e=>{ if(!e.target.closest(".search")) box.hidden=true; });
  document.getElementById("lang").addEventListener("click",()=>{
    L = L==="en"?"fr":"en"; try{localStorage.setItem("fg-lang",L);}catch(e){}
    render(); if(q.value) search();
  });
}
render(); wire();
if(location.hash){ const id=location.hash.slice(1); setTimeout(()=>go(id),60); }
</script>
